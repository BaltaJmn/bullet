name: pages

# La politica vive en store/privacy/index.html y se publica tal cual en bullet.baltajmn.dev. Solo ese
# fichero: el README de al lado es para quien mantiene el repositorio, no para la web.
on:
  push:
    branches: [main]
    paths: ["store/privacy/index.html"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp store/privacy/index.html _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
