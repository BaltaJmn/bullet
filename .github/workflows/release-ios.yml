name: Release to TestFlight

# Same trigger as the Play workflow: one tag ships both stores.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    # The shared one signs with our own Apple Development and Distribution identities: signing in
    # the cloud fails with ITMS-90035 on this account (BaltaJmn/ci PUBLICAR.md 5). Secrets one by
    # one, never `secrets: inherit`: the Play ones have nothing to do here.
    uses: BaltaJmn/ci/.github/workflows/ios-testflight-release.yml@main
    with:
      # versionName and versionCode are the iOS version and build: one number for both stores.
      version-file: androidApp/build.gradle.kts
    secrets:
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_DEVELOPMENT_P12: ${{ secrets.APPLE_DEVELOPMENT_P12 }}
      APPLE_DEVELOPMENT_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
      APPLE_DISTRIBUTION_P12: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
      APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
